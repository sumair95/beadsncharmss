<style>
@keyframes spin{to{transform:rotate(360deg)}}
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --p1:#3D2467;--p2:#6B4E9B;--p3:#9B7BB8;--p4:#C4A8D8;--p5:#E8D5F5;--p6:#F4EDFC;
  --b1:#F7F3EE;--b2:#EDE6DC;--b3:#DDD3C5;
  --dk:#1A0E2E;--mid:#4A3566;--lt:#8B7BAA;--xl:#C4B8D4;
  --sale:#C0392B;--green:#2D7D52;
  --r8:8px;--r12:12px;--r20:20px;--r50:50px;
  --sh:0 2px 20px rgba(61,36,103,.08);--sh2:0 8px 40px rgba(61,36,103,.14);
}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--b1);color:var(--dk);overflow-x:hidden}
h1,h2,h3,h4,.serif{font-family:'Cormorant Garamond',serif}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:'Inter',sans-serif;border:none;background:none}
img{display:block;max-width:100%}
input,select,textarea{font-family:'Inter',sans-serif}

/* ── Announcement ── */
.announce{background:var(--p1);color:#fff;text-align:center;padding:9px 16px;font-size:12px;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;gap:0;flex-wrap:wrap}
#announceTagline{font-style:italic;color:var(--p4);font-size:11px}

/* ── Nav ── */
nav{background:rgba(247,243,238,.96);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(196,168,216,.2)}
.nav-wrap{max-width:1320px;margin:0 auto;padding:0 32px;height:68px;display:flex;align-items:center;gap:40px}
.logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--dk);white-space:nowrap;letter-spacing:.02em}
.logo em{color:var(--p2);font-style:italic}
.nav-links{display:flex;gap:32px;align-items:center;flex:1}
.nav-link{font-size:13px;font-weight:500;color:var(--mid);letter-spacing:.02em;transition:color .2s;position:relative;padding-bottom:2px}
.nav-link:hover,.nav-link.active{color:var(--p1)}
.nav-link.active::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:1.5px;background:var(--p1);border-radius:2px}
.nav-cats{position:relative}
.nav-cats:hover .cat-drop{opacity:1;pointer-events:all;transform:translateY(0)}
.cat-drop{position:absolute;top:calc(100% + 18px);left:-12px;background:#fff;border-radius:var(--r12);box-shadow:var(--sh2);border:1px solid rgba(196,168,216,.2);padding:8px;min-width:200px;opacity:0;pointer-events:none;transform:translateY(8px);transition:all .2s;z-index:200}
.cat-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;font-size:13px;color:var(--mid);transition:all .18s;cursor:pointer}
.cat-item:hover{background:var(--p6);color:var(--p1)}
.cat-item .ci{font-size:18px;width:24px;text-align:center}
.cat-parent{position:relative;flex-direction:row}
.cat-sub-drop{position:absolute;left:100%;top:0;background:#fff;border-radius:var(--r12);box-shadow:var(--sh2);border:1px solid rgba(196,168,216,.2);padding:8px;min-width:180px;display:none;z-index:300}
.cat-parent:hover .cat-sub-drop,.cat-parent.sub-open .cat-sub-drop{display:block}
.nav-right{display:flex;align-items:center;gap:4px;margin-left:auto}
.icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mid);transition:all .18s;position:relative}
.icon-btn:hover{background:var(--p6);color:var(--p1)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cart-pip{position:absolute;top:6px;right:6px;width:16px;height:16px;background:var(--p1);color:#fff;border-radius:50%;font-size:9px;font-weight:700;display:none;align-items:center;justify-content:center;line-height:1}
.cart-pip.show{display:flex}
.hamburger{display:none;flex-direction:column;gap:5px;padding:8px}
.hamburger span{display:block;width:22px;height:1.5px;background:var(--dk);border-radius:2px;transition:.2s}

/* ── Search overlay ── */
.search-over{position:fixed;inset:0;z-index:300;background:rgba(26,14,46,.55);backdrop-filter:blur(4px);display:flex;flex-direction:column;align-items:center;padding-top:100px;opacity:0;pointer-events:none;transition:opacity .2s}
.search-over.open{opacity:1;pointer-events:all}
.search-inner{width:100%;max-width:600px;padding:0 24px}
.search-bar{display:flex;align-items:center;background:#fff;border-radius:var(--r50);padding:0 20px;gap:12px;border:1.5px solid var(--p4)}
.search-bar input{flex:1;padding:16px 0;border:none;outline:none;font-size:15px;color:var(--dk);background:transparent}
.search-bar input::placeholder{color:var(--xl)}
.search-bar button{color:var(--lt)}
.search-results-wrap{background:#fff;border-radius:var(--r12);margin-top:8px;overflow:hidden;box-shadow:var(--sh2);border:1px solid rgba(196,168,216,.15)}
.sr-item{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid rgba(196,168,216,.1);cursor:pointer;transition:background .15s}
.sr-item:last-child{border-bottom:none}
.sr-item:hover{background:var(--p6)}
.sr-thumb{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0}
.sr-name{font-size:14px;font-weight:500;color:var(--dk)}
.sr-price{font-size:12px;color:var(--p2);margin-top:2px}
.search-empty{padding:24px;text-align:center;color:var(--lt);font-size:14px}

/* ── Hero ── */
.hero{min-height:calc(100vh - 97px);display:grid;grid-template-columns:1fr 1fr;overflow:hidden;background:var(--b1)}
.hero-left{display:flex;flex-direction:column;justify-content:center;padding:80px 48px 80px 64px;max-width:680px}
.hero-eyebrow{font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--p2);margin-bottom:28px;display:flex;align-items:center;gap:10px}
.hero-eyebrow::before{content:'';display:block;width:32px;height:1px;background:var(--p3)}
.hero-h1{font-size:clamp(64px,7vw,100px);font-weight:400;line-height:.95;color:var(--dk);margin-bottom:32px;letter-spacing:-.02em}
.hero-h1 em{color:var(--p2);font-style:italic;font-weight:300}
.hero-body{font-size:15px;color:var(--mid);line-height:1.75;max-width:380px;margin-bottom:44px}
.hero-btns{display:flex;gap:14px;flex-wrap:wrap}
.btn-fill{padding:14px 32px;background:var(--p1);color:#fff;border-radius:var(--r50);font-size:13px;font-weight:500;letter-spacing:.04em;transition:all .2s;border:1.5px solid var(--p1)}
.btn-fill:hover{background:var(--p2);border-color:var(--p2);transform:translateY(-1px);box-shadow:0 6px 20px rgba(61,36,103,.25)}
.btn-outline{padding:14px 32px;border:1.5px solid var(--p3);color:var(--p1);border-radius:var(--r50);font-size:13px;font-weight:500;letter-spacing:.04em;transition:all .2s}
.btn-outline:hover{background:var(--p6);border-color:var(--p1)}
.btn-sm{padding:10px 22px;font-size:12px}
.btn-danger{background:var(--sale);border-color:var(--sale)}
.btn-danger:hover{background:#a93226}
.btn-ghost{padding:10px 20px;color:var(--mid);font-size:13px;border:1px solid var(--b3);border-radius:var(--r8);transition:all .18s}
.btn-ghost:hover{border-color:var(--p3);color:var(--p1)}

.hero-right{background:var(--p6);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.hero-right::before{content:'';position:absolute;top:-80px;right:-80px;width:400px;height:400px;border-radius:50%;background:var(--p5);opacity:.5}
.hero-right::after{content:'';position:absolute;bottom:-60px;left:-60px;width:280px;height:280px;border-radius:50%;background:var(--p4);opacity:.25}
.hero-mosaic{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:60px 48px}
.mosaic-card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:var(--sh);transition:transform .3s;cursor:pointer}
.mosaic-card:hover{transform:translateY(-6px);box-shadow:var(--sh2)}
.mosaic-card:nth-child(2){margin-top:40px}
.mosaic-card:nth-child(4){margin-top:-30px}
.mosaic-img{height:200px;display:flex;align-items:center;justify-content:center;font-size:3.5rem}
.mosaic-info{padding:14px 16px}
.mosaic-name{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:500;color:var(--dk);margin-bottom:4px}
.mosaic-price{font-size:12px;font-weight:600;color:var(--p2)}
.mosaic-badge{display:inline-block;padding:2px 8px;background:var(--sale);color:#fff;border-radius:4px;font-size:10px;font-weight:700;margin-left:6px}

/* ── Section commons ── */
.section{padding:80px 0}
.section-alt{background:#fff}
.container{max-width:1320px;margin:0 auto;padding:0 32px}
.sec-hdr{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:48px;gap:24px}
.sec-hdr-left{}
.sec-eyebrow{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--p2);margin-bottom:10px}
.sec-title{font-family:'Cormorant Garamond',serif;font-size:clamp(32px,3.5vw,48px);font-weight:400;color:var(--dk);line-height:1.1}
.sec-title em{font-style:italic;color:var(--p2)}
.link-arrow{font-size:13px;font-weight:500;color:var(--p2);display:flex;align-items:center;gap:6px;transition:gap .2s;white-space:nowrap}
.link-arrow:hover{gap:10px;color:var(--p1)}

/* ── Category strip ── */
.cat-strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cat-strip::-webkit-scrollbar{display:none}
.cat-pill{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:10px 20px;background:#fff;border:1px solid rgba(196,168,216,.3);border-radius:var(--r50);font-size:13px;font-weight:500;color:var(--mid);cursor:pointer;transition:all .18s;white-space:nowrap}
.cat-pill:hover,.cat-pill.active{background:var(--p1);color:#fff;border-color:var(--p1)}
.cat-pill .ce{font-size:16px}

/* ── Products grid ── */
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px}
.product-card{background:#fff;border-radius:var(--r20);overflow:hidden;border:1px solid rgba(196,168,216,.15);cursor:pointer;transition:all .25s;position:relative}
.product-card:hover{transform:translateY(-6px);box-shadow:var(--sh2);border-color:var(--p4)}
.pc-img{height:260px;display:flex;align-items:center;justify-content:center;font-size:4rem;position:relative;overflow:hidden}
.pc-badges{position:absolute;top:14px;left:14px;display:flex;flex-direction:column;gap:6px}
.badge-sale{background:var(--sale);color:#fff;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700}
.badge-new{background:var(--p1);color:#fff;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700}
.badge-oos{background:rgba(0,0,0,.45);color:#fff;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700}
.pc-quick{position:absolute;bottom:0;left:0;right:0;background:var(--p1);color:#fff;padding:14px;font-size:13px;font-weight:500;letter-spacing:.03em;text-align:center;transform:translateY(100%);transition:transform .22s;opacity:0}
.product-card:hover .pc-quick{transform:translateY(0);opacity:1}
.pc-quick.oos-btn{background:#888;cursor:not-allowed}
.pc-body{padding:18px 20px 20px}
.pc-cat{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--p3);margin-bottom:6px}
.pc-name{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:500;color:var(--dk);margin-bottom:10px;line-height:1.3}
.pc-prices{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pc-price{font-size:15px;font-weight:600;color:var(--dk)}
.pc-orig{font-size:13px;color:var(--xl);text-decoration:line-through}
.pc-sale{font-size:15px;font-weight:700;color:var(--sale)}
.pc-wishlist{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.product-card:hover .pc-wishlist{opacity:1}
.empty-grid{grid-column:1/-1;text-align:center;padding:60px 0;color:var(--lt);font-size:15px}

/* ── Sale Banner ── */
.sale-section{background:linear-gradient(135deg,var(--p1) 0%,var(--p2) 100%);padding:80px 32px;text-align:center;position:relative;overflow:hidden}
.sale-section::before{content:'';position:absolute;top:-100px;left:-100px;width:350px;height:350px;border-radius:50%;background:rgba(255,255,255,.06)}
.sale-section::after{content:'';position:absolute;bottom:-80px;right:-80px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.04)}
.sale-inner{position:relative;z-index:1;max-width:560px;margin:0 auto}
.sale-eyebrow{font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--p4);margin-bottom:16px}
.sale-title{font-family:'Cormorant Garamond',serif;font-size:clamp(44px,5vw,64px);font-weight:400;color:#fff;line-height:1;margin-bottom:16px}
.sale-sub{font-size:15px;color:rgba(255,255,255,.75);margin-bottom:36px}
.btn-white{background:#fff;color:var(--p1);border:2px solid #fff;border-radius:var(--r50);padding:14px 36px;font-size:13px;font-weight:600;transition:all .2s}
.btn-white:hover{background:transparent;color:#fff}

/* ── About ── */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
.about-visual{position:relative}
.about-card-big{background:var(--p6);border-radius:24px;height:480px;display:flex;align-items:center;justify-content:center;font-size:5rem;position:relative;overflow:hidden}
.about-card-big::before{content:'';position:absolute;top:30px;right:30px;width:120px;height:120px;border-radius:50%;background:var(--p5);opacity:.8}
.about-card-small{position:absolute;bottom:-24px;right:-24px;background:#fff;border-radius:18px;padding:20px 24px;box-shadow:var(--sh2);border:1px solid rgba(196,168,216,.2)}
.about-card-small h4{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:500;color:var(--dk);margin-bottom:4px}
.about-card-small p{font-size:12px;color:var(--lt)}
.about-text .sec-eyebrow{display:block;margin-bottom:10px}
.about-text h2{margin-bottom:20px}
.about-body{font-size:15px;color:var(--mid);line-height:1.8;margin-bottom:16px}

/* ── Insta strip ── */
.insta-wrap{background:var(--b1)}
.insta-label{text-align:center;padding:48px 0 20px;font-size:13px;color:var(--lt)}
.insta-label a{color:var(--p1);font-weight:600}
.insta-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.insta-tile{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:2.2rem;cursor:pointer;overflow:hidden;transition:transform .2s;border-radius:4px}
.insta-tile:hover{transform:scale(1.04)}

/* ── Footer ── */
footer{background:var(--dk);color:rgba(255,255,255,.6);padding:64px 0 0}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:48px;margin-bottom:48px}
.footer-brand .logo{color:#fff;font-size:20px;margin-bottom:14px;display:block}
.footer-brand p{font-size:13px;line-height:1.7;margin-bottom:20px}
.socials{display:flex;gap:12px}
.social-btn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);font-size:13px;transition:all .18s}
.social-btn:hover{border-color:var(--p4);color:var(--p4)}
.footer-col h4{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.9);margin-bottom:18px}
.footer-col ul li{margin-bottom:10px}
.footer-col ul li a{font-size:13px;color:rgba(255,255,255,.5);transition:color .18s}
.footer-col ul li a:hover{color:#fff}
.footer-bottom{border-top:1px solid rgba(255,255,255,.08);padding:20px 0;text-align:center;font-size:12px;color:rgba(255,255,255,.25)}

/* ── Cart drawer ── */
.cart-overlay{position:fixed;inset:0;z-index:200;background:rgba(26,14,46,.5);opacity:0;pointer-events:none;transition:opacity .25s}
.cart-overlay.open{opacity:1;pointer-events:all}
.cart-drawer{position:fixed;top:0;right:0;bottom:0;z-index:201;width:420px;max-width:100%;background:#fff;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-12px 0 60px rgba(26,14,46,.12)}
.cart-drawer.open{transform:translateX(0)}
.cart-hdr{padding:24px 28px;border-bottom:1px solid rgba(196,168,216,.15);display:flex;align-items:center;justify-content:space-between}
.cart-hdr h3{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;color:var(--dk)}
.cart-hdr button{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--lt);transition:all .15s;font-size:18px}
.cart-hdr button:hover{background:var(--p6);color:var(--p1)}
.cart-body{flex:1;overflow-y:auto;padding:20px 28px}
.cart-empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;color:var(--lt)}
.cart-empty-state .big-icon{font-size:3rem}
.cart-empty-state p{font-size:14px}
.cart-item{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid rgba(196,168,216,.12)}

.contact-form-card h3{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:500;color:var(--dk);margin-bottom:24px}

/* ── Product photo support (falls back to emoji when no image) ── */
.mosaic-img,.sr-thumb,.ci-thumb,.pdp-main-img,.pdp-thumb,.oi-thumb,.at-thumb{position:relative;overflow:hidden}
.prod-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* ── Responsive ── */
@media(max-width:1024px){
  .hero{grid-template-columns:1fr;min-height:auto}
  .hero-right{display:none}
  .hero-left{max-width:100%;padding:60px 32px}
  .about-grid,.about-page-grid{grid-template-columns:1fr}
  .footer-grid{grid-template-columns:1fr 1fr;gap:32px}
  .admin-layout{grid-template-columns:1fr}
  .admin-sidebar{height:auto;position:static}
  .stat-grid{grid-template-columns:1fr 1fr}
  .pdp-wrap{grid-template-columns:1fr}
  .pdp-gallery{position:static}
  .checkout-wrap{grid-template-columns:1fr}
  .checkout-sidebar{position:static}
  .contact-page{grid-template-columns:1fr}
  .perm-banner{grid-template-columns:1fr}
  .values-row{grid-template-columns:1fr}
  .shop-layout{grid-template-columns:1fr;gap:28px}
  /* Keep filters reachable on mobile — collapse them into a wrapping pill row */
  .sidebar{position:static}
  .sidebar-section{margin-bottom:20px}
  .sidebar-section .filter-opt{display:inline-flex;width:auto;border:1px solid rgba(196,168,216,.3);border-radius:var(--r50);margin:0 6px 6px 0;padding:7px 14px;font-size:12px}
  .filter-opt-count{display:none}
}
@media(max-width:768px){
  .nav-links{display:none;position:fixed;top:97px;left:0;right:0;background:#fff;flex-direction:column;gap:0;padding:12px 0;border-bottom:1px solid rgba(196,168,216,.15);z-index:99;box-shadow:var(--sh)}
  .nav-links.open{display:flex}
  .hamburger{display:flex}
  .hero-left{padding:48px 24px}
  .products-grid{grid-template-columns:repeat(2,1fr);gap:16px}
  .mosaic-img{height:140px}
  .insta-strip{grid-template-columns:repeat(3,1fr)}
  .footer-grid{grid-template-columns:1fr}
  .container,.shop-layout,.pdp-wrap,.checkout-wrap,.about-page,.contact-page{padding-left:20px;padding-right:20px}
  .form-row{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:1fr 1fr}
  .about-hero-split{grid-template-columns:1fr}
}
@media(max-width:480px){
  .products-grid{grid-template-columns:1fr}
  .hero-btns{flex-direction:column}
  .cat-strip{gap:8px}
}
</style>
</head>
<body>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- CART OVERLAY -->
<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>

<!-- CART DRAWER -->
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-hdr">
    <h3>Your Cart</h3>
    <button onclick="closeCart()" aria-label="Close cart">✕</button>
  </div>
  <div class="cart-body" id="cartBody"></div>
  <div class="cart-ftr" id="cartFtr"></div>
</div>

<!-- SEARCH OVERLAY -->
<div class="search-over" id="searchOver">
  <button style="position:absolute;top:24px;right:32px;color:rgba(255,255,255,.7);font-size:20px;padding:8px" onclick="closeSearch()">✕</button>
  <div class="search-inner">
    <div class="search-bar">
      <svg width="18" height="18" viewBox="0 0 24 24" style="color:var(--lt);flex-shrink:0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Search jewellery, charms, bracelets…" oninput="handleSearch(this.value)" autofocus>
      <button onclick="closeSearch()" style="color:var(--lt);font-size:18px">✕</button>
    </div>
    <div id="searchResultsWrap"></div>
  </div>
</div>

<!-- SUCCESS MODAL -->
<div class="modal-bg" id="successModal">
  <div class="modal-box">
    <div class="modal-icon">🎉</div>
    <div class="modal-title">Order Placed!</div>
    <div class="modal-id" id="successOrderId">ORD-000000</div>
    <div class="modal-sub">Thank you for shopping with Beads N Charms! We'll confirm your order via WhatsApp within a few hours. ✨</div>
    <button class="btn-fill" onclick="closeSuccessModal();renderPage('home')">Continue Shopping</button>
  </div>
</div>

<!-- PRODUCT MODAL FORM (admin) -->
<div class="modal-form" id="productFormModal">
  <div class="modal-form-inner">
    <div class="modal-form-hdr">
      <h3 id="pfmTitle">Add Product</h3>
      <button onclick="closePFM()" style="font-size:20px;color:var(--lt)">✕</button>
    </div>
    <input type="hidden" id="pfmId">
    <div class="form-field"><label class="form-label">Product Name *</label><input type="text" class="form-input" id="pfmName" placeholder="e.g. Pearl Beaded Bracelet"></div>
    <div class="form-row">
      <div class="form-field"><label class="form-label">Category *</label><select class="form-input" id="pfmCat"></select></div>
      <div class="form-field"><label class="form-label">Price (PKR) *</label><input type="number" class="form-input" id="pfmPrice" placeholder="850" min="1"></div>
    </div>
    <div class="form-field"><label class="form-label">Description</label><textarea class="form-input" id="pfmDesc" placeholder="Describe the piece…"></textarea></div>
    <div class="form-field"><label class="form-label">Tags (comma separated)</label><input type="text" class="form-input" id="pfmTags" placeholder="ring, gold, minimal"></div>
    <div class="form-field"><label class="form-label">Icon Emoji</label><div class="emoji-row" id="emojiPicker"></div><input type="text" class="form-input" id="pfmEmoji" style="margin-top:8px" placeholder="Or type custom emoji"></div>
    <div class="form-field"><label class="form-label">Card Colour</label><div class="color-row" id="colorPicker"></div></div>
    <div style="display:flex;gap:24px;margin-bottom:18px;flex-wrap:wrap">
      <label class="toggle-switch"><input type="checkbox" id="pfmInstock" checked><div class="ts-track"><div class="ts-thumb"></div></div><span class="ts-label">In Stock</span></label>
      <label class="toggle-switch"><input type="checkbox" id="pfmFeatured"><div class="ts-track"><div class="ts-thumb"></div></div><span class="ts-label">Featured</span></label>
      <label class="toggle-switch"><input type="checkbox" id="pfmOnSale" onchange="togglePFMSale()"><div class="ts-track"><div class="ts-thumb"></div></div><span class="ts-label">On Sale</span></label>
    </div>
    <div id="pfmSaleFields" style="display:none">
      <div class="form-field"><label class="form-label">Discount %</label><input type="number" class="form-input" id="pfmSalePct" min="1" max="90" placeholder="e.g. 20" oninput="previewPFMSale()"></div>
      <p id="pfmSalePreview" style="font-size:13px;color:var(--sale);font-weight:600;margin-bottom:14px"></p>
    </div>
    <div class="form-field">
      <label class="form-label">Product Image (optional)</label>
      <input type="file" id="pfmImage" accept="image/*" style="width:100%;padding:10px;border:1.5px dashed rgba(196,168,216,.5);border-radius:10px;font-size:13px;cursor:pointer">
      <div style="font-size:11px;color:var(--lt);margin-top:4px">Upload to Supabase Storage. Replaces emoji if set.</div>
      <div id="pfmImagePreview" style="margin-top:8px;display:none"><img id="pfmPreviewImg" style="width:80px;height:80px;object-fit:cover;border-radius:10px;border:1px solid var(--b3)"></div>
    </div>
    <div style="display:flex;gap:12px">
      <button class="btn-fill" onclick="savePFM()" style="flex:1;padding:14px;border-radius:var(--r50);font-size:13px;font-weight:600;letter-spacing:.04em">Save Product</button>
      <button class="btn-outline" onclick="closePFM()" style="padding:14px 24px;border-radius:var(--r50);font-size:13px">Cancel</button>
    </div>
  </div>
</div>

<!-- CATEGORY MODAL -->
<div class="modal-form" id="catFormModal">
  <div class="modal-form-inner" style="max-width:420px">
    <div class="modal-form-hdr">
      <h3 id="cfmTitle">Add Category</h3>
      <button onclick="closeCFM()" style="font-size:20px;color:var(--lt)">✕</button>
    </div>
    <input type="hidden" id="cfmId">
    <div class="form-field"><label class="form-label">Category Name *</label><input type="text" class="form-input" id="cfmName" placeholder="e.g. Anklets"></div>
    <div class="form-field"><label class="form-label">Description</label><input type="text" class="form-input" id="cfmDesc" placeholder="Short description"></div>
    <div class="form-field"><label class="form-label">Icon Emoji *</label><div class="emoji-row" id="catEmojiPicker"></div><input type="text" class="form-input" id="cfmEmoji" style="margin-top:8px" placeholder="Or type emoji"></div>
    <div style="display:flex;gap:12px">
      <button class="btn-fill" onclick="saveCFM()" style="flex:1;padding:14px;border-radius:var(--r50);font-size:13px;font-weight:600;letter-spacing:.04em">Save Category</button>
      <button class="btn-outline" onclick="closeCFM()" style="padding:14px 24px;border-radius:var(--r50);font-size:13px">Cancel</button>
    </div>
  </div>
</div>

<!-- APP MOUNT -->
<div id="app"></div>

<script>
// ═══════════════════════════════════════════════
//  DATA STORE
// ═══════════════════════════════════════════════
const SK = {P:'bnc_products',C:'bnc_categories',O:'bnc_orders',CART:'bnc_cart'};

const DEF_CATS = [
  {id:'rings',name:'Rings',emoji:'💍',desc:'Delicate & statement rings'},
  {id:'bracelets',name:'Bracelets',emoji:'📿',desc:'Beaded & charm bracelets'},
  {id:'necklaces',name:'Necklaces',emoji:'✨',desc:'Layered & pendant necklaces'},
  {id:'earrings',name:'Earrings',emoji:'🌸',desc:'Studs, hoops & drops'},
  {id:'charms',name:'Phone Charms',emoji:'📱',desc:'Cute phone & bag charms'},
  {id:'keychains',name:'Keychains',emoji:'🔑',desc:'Personalised keychains'},
  {id:'permanent',name:'Permanent Jewellery',emoji:'💜',desc:'Welded-on forever pieces'},
];

const COLORS = [
  'linear-gradient(135deg,#F4EDFC,#E8D5F5)',
  'linear-gradient(135deg,#C4A8D8,#9B7BB8)',
  'linear-gradient(135deg,#E8D5F5,#C4A8D8)',
  'linear-gradient(135deg,#F7F3EE,#EDE6DC)',
  'linear-gradient(135deg,#9B7BB8,#6B4E9B)',
  'linear-gradient(135deg,#EDE6DC,#E8D5F5)',
  'linear-gradient(135deg,#F9E4EA,#E8D5F5)',
  'linear-gradient(135deg,#3D2467,#6B4E9B)',
];

const DEF_PRODS = [
  {id:'p1',name:'Pearl Beaded Bracelet',cat:'bracelets',price:850,onSale:false,salePct:0,desc:'Delicate freshwater pearl bracelet with gold-filled clasp. Adjustable sizing, perfect for stacking.',tags:['pearl','bracelet','minimal'],inStock:true,featured:true,emoji:'📿',color:COLORS[0]},
  {id:'p2',name:'Moon & Star Charm Set',cat:'charms',price:650,onSale:true,salePct:30,desc:'Set of 3 celestial phone charms — crescent moon, star, and cloud. Detachable lobster clasp.',tags:['moon','star','charm'],inStock:true,featured:true,emoji:'🌙',color:COLORS[1]},
  {id:'p3',name:'Lilac Flower Ring',cat:'rings',price:550,onSale:false,salePct:0,desc:'Dainty adjustable ring with hand-painted lilac flower resin detail. One size fits most.',tags:['ring','flower','lilac'],inStock:true,featured:true,emoji:'💜',color:COLORS[2]},
  {id:'p4',name:'Permanent Gold Bracelet',cat:'permanent',price:2500,onSale:false,salePct:0,desc:'Our signature permanent bracelet — welded onto your wrist for a forever look. Gold-filled chain. Visit our stall for fitting.',tags:['permanent','gold','forever'],inStock:true,featured:true,emoji:'✨',color:COLORS[3]},
  {id:'p5',name:'Butterfly Keychain',cat:'keychains',price:450,onSale:true,salePct:22,desc:'Beaded butterfly keychain in purple and pink tones. Approx 12cm length.',tags:['butterfly','keychain','beaded'],inStock:true,featured:true,emoji:'🦋',color:COLORS[4]},
  {id:'p6',name:'Crystal Drop Earrings',cat:'earrings',price:700,onSale:false,salePct:0,desc:'Amethyst-toned crystal drop earrings with surgical steel posts. Hypoallergenic.',tags:['earrings','crystal','amethyst'],inStock:true,featured:true,emoji:'💎',color:COLORS[5]},
  {id:'p7',name:'Layered Chain Necklace',cat:'necklaces',price:1200,onSale:true,salePct:21,desc:'Three-layer gold-filled chain necklace with tiny charm pendants. Adjustable 40–45cm.',tags:['necklace','layered','chain'],inStock:true,featured:false,emoji:'📿',color:COLORS[0]},
  {id:'p8',name:'Purple Stackable Ring',cat:'rings',price:400,onSale:false,salePct:0,desc:'Stackable ring with purple seed beads on elastic band. Set of 2 rings.',tags:['ring','bead','purple'],inStock:true,featured:false,emoji:'💍',color:COLORS[2]},
  {id:'p9',name:'Strawberry Phone Charm',cat:'charms',price:380,onSale:false,salePct:0,desc:'Cute handmade strawberry phone charm with beaded details.',tags:['strawberry','charm','cute'],inStock:false,featured:false,emoji:'🍓',color:COLORS[6]},
  {id:'p10',name:'Beaded Friendship Bracelet',cat:'bracelets',price:650,onSale:true,salePct:23,desc:'Colourful seed bead bracelet in purple, lilac and beige. Adjustable macramé tie.',tags:['friendship','bracelet','colorful'],inStock:true,featured:false,emoji:'🌈',color:COLORS[5]},
];

const Store = {
  getCats(){return JSON.parse(localStorage.getItem(SK.C)||'null')||DEF_CATS},
  saveCats(d){localStorage.setItem(SK.C,JSON.stringify(d))},
  getProds(){return JSON.parse(localStorage.getItem(SK.P)||'null')||DEF_PRODS},
  saveProds(d){localStorage.setItem(SK.P,JSON.stringify(d))},
  getOrders(){return JSON.parse(localStorage.getItem(SK.O)||'[]')},
  addOrder(o){const orders=this.getOrders();o.id=o.id||('ORD-'+Date.now());o.date=new Date().toISOString();o.status='pending';orders.unshift(o);localStorage.setItem(SK.O,JSON.stringify(orders));return o},
  updateOrderStatus(id,status){const orders=this.getOrders().map(o=>o.id===id?{...o,status}:o);localStorage.setItem(SK.O,JSON.stringify(orders))},
  addProd(p){const prods=this.getProds();p.id='p'+Date.now();prods.push(p);this.saveProds(prods);return p},
  updateProd(id,u){this.saveProds(this.getProds().map(p=>p.id===id?{...p,...u}:p))},
  deleteProd(id){this.saveProds(this.getProds().filter(p=>p.id!==id))},
  getProd(id){return this.getProds().find(p=>p.id===id)},
  addCat(c){const cats=this.getCats();cats.push(c);this.saveCats(cats)},
  updateCat(id,u){this.saveCats(this.getCats().map(c=>c.id===id?{...c,...u}:c))},
  deleteCat(id){this.saveCats(this.getCats().filter(c=>c.id!==id))},
  getCat(id){return this.getCats().find(c=>c.id===id)},
};

// ═══════════════════════════════════════════════
//  CART
// ═══════════════════════════════════════════════
const Cart={
  get(){return JSON.parse(localStorage.getItem(SK.CART)||'[]')},
  save(items){localStorage.setItem(SK.CART,JSON.stringify(items));refreshCartUI()},
  add(productId){const items=this.get();const ex=items.find(i=>i.id===productId);if(ex)ex.qty++;else items.push({id:productId,qty:1});this.save(items)},
  remove(productId){this.save(this.get().filter(i=>i.id!==productId))},
  setQty(productId,qty){if(qty<1){this.remove(productId);return;}this.save(this.get().map(i=>i.id===productId?{...i,qty}:i))},
  clear(){this.save([])},
  total(){return this.get().reduce((s,i)=>{const p=Store.getProd(i.id);return p?s+salePrice(p)*i.qty:s},0)},
  count(){return this.get().reduce((s,i)=>s+i.qty,0)},
};

function salePrice(p){return p.onSale&&p.salePct>0?Math.round(p.price*(1-p.salePct/100)):p.price}
function catName(id){const c=Store.getCat(id);return c?c.name:id}

// ═══════════════════════════════════════════════
//  HTML ESCAPING
//  Everything customer- or admin-entered goes through esc()
//  before it touches innerHTML. Order/contact fields are
//  attacker-controlled and render inside the admin panel.
// ═══════════════════════════════════════════════
const ESC_MAP={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>ESC_MAP[c])}

// Product media: photo when one was uploaded, emoji otherwise.
function media(p){
  return p.image
    ?`<img class="prod-media" src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">`
    :esc(p.emoji);
}

function addToCart(id){
  const p=Store.getProd(id);
  if(!p||!p.inStock)return;
  Cart.add(id);
  toast('Added to cart ✦');
  openCart();
}

function refreshCartUI(){
  const count=Cart.count();
  const pip=document.getElementById('cartPip');
  if(pip){pip.textContent=count;pip.className='cart-pip'+(count>0?' show':'');}
  renderCartDrawer();
}

function renderCartDrawer(){
  const body=document.getElementById('cartBody');
  const ftr=document.getElementById('cartFtr');
  if(!body)return;
  const items=Cart.get();
  if(!items.length){
    body.innerHTML=`<div class="cart-empty-state"><div class="big-icon">🛒</div><p>Your cart is empty</p><button class="btn-fill btn-sm" onclick="closeCart();renderPage('shop')" style="border-radius:50px;padding:10px 24px;font-size:13px;font-weight:500">Browse Shop</button></div>`;
    if(ftr)ftr.innerHTML='';
    return;
  }
  body.innerHTML=items.map(item=>{
    const p=Store.getProd(item.id);if(!p)return'';
    const sp=salePrice(p);
    return`<div class="cart-item">
      <div class="ci-thumb" style="background:${esc(p.color)}">${media(p)}</div>
      <div class="ci-info">
        <div class="ci-name">${esc(p.name)}</div>
        <div class="ci-price">PKR ${sp.toLocaleString()}</div>
        <div class="ci-qty">
          <button class="qty-btn" onclick="Cart.setQty('${p.id}',${item.qty-1})">−</button>
          <span class="qty-val">${item.qty}</span>
          <button class="qty-btn" onclick="Cart.setQty('${p.id}',${item.qty+1})">+</button>
        </div>
      </div>
      <button class="ci-del" onclick="Cart.remove('${p.id}')">✕</button>
    </div>`;
  }).join('');
  const sub=Cart.total();
  const del=sub>=2000?0:300;
  if(ftr)ftr.innerHTML=`
    <div class="cart-total-row"><span>Subtotal</span><span>PKR ${sub.toLocaleString()}</span></div>
    <div class="cart-total-row"><span>Delivery</span><span>${del===0?'<span style="color:var(--green);font-weight:600">FREE</span>':'PKR '+del}</span></div>
    <div class="cart-grand"><span>Total</span><span>PKR ${(sub+del).toLocaleString()}</span></div>
    <p class="cart-note">PKR 300 delivery fee | Free above PKR 2,000</p>
    <button class="btn-block btn-block-fill" onclick="closeCart();renderPage('checkout')">Proceed to Checkout</button>
    <button class="btn-block btn-block-out" onclick="closeCart();renderPage('shop')">Continue Shopping</button>`;
}

function openCart(){document.getElementById('cartDrawer').classList.add('open');document.getElementById('cartOverlay').classList.add('open')}
function closeCart(){document.getElementById('cartDrawer').classList.remove('open');document.getElementById('cartOverlay').classList.remove('open')}

// ═══════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════
let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3000);
}

// ═══════════════════════════════════════════════
//  SEARCH
// ═══════════════════════════════════════════════
function openSearch(){document.getElementById('searchOver').classList.add('open');setTimeout(()=>document.getElementById('searchInput')?.focus(),50)}
function closeSearch(){document.getElementById('searchOver').classList.remove('open')}
function handleSearch(q){
  const wrap=document.getElementById('searchResultsWrap');if(!wrap)return;
  if(!q.trim()){wrap.innerHTML='';return;}
  const results=Store.getProds().filter(p=>{
    const lq=q.toLowerCase();
    return p.name.toLowerCase().includes(lq)||(p.tags||[]).some(t=>t.includes(lq))||catName(p.cat).toLowerCase().includes(lq);
  }).slice(0,6);
  if(!results.length){wrap.innerHTML='<div class="search-results-wrap"><div class="search-empty">No results for "'+esc(q)+'"</div></div>';return;}
  wrap.innerHTML='<div class="search-results-wrap">'+results.map(p=>`
    <div class="sr-item" onclick="closeSearch();renderPage('product','${esc(p.id)}')">
      <div class="sr-thumb" style="background:${esc(p.color)}">${media(p)}</div>
      <div><div class="sr-name">${esc(p.name)}</div><div class="sr-price">PKR ${salePrice(p).toLocaleString()}</div></div>
    </div>`).join('')+'</div>';
}

// ═══════════════════════════════════════════════
//  ROUTER
// ═══════════════════════════════════════════════
let currentPage='home',currentPageData=null;
function renderPage(page,data=null){
  currentPage=page;currentPageData=data;
  window.scrollTo(0,0);
  const app=document.getElementById('app');
  if(!app)return;
  const pages={
    home:renderHome,shop:renderShop,product:renderProduct,
    checkout:renderCheckout,about:renderAbout,contact:renderContact,admin:renderAdmin,
  };
  if(pages[page])app.innerHTML=pages[page](data);
  else app.innerHTML='<p style="padding:80px;text-align:center">Page not found</p>';
  refreshCartUI();
  initPageScripts(page,data);
}

// ═══════════════════════════════════════════════
//  NAV COMPONENT
// ═══════════════════════════════════════════════
function navHTML(activePage=''){
  const cats=Store.getCats();
  return`
  <div class="announce" id="announceBar">
    <span id="announceLeft">✦ Free delivery above PKR 2,000 &nbsp;|&nbsp; PKR 300 delivery on all other orders ✦</span>
    <span id="announceTagline" style="display:none;margin-left:24px;opacity:1;transition:opacity .5s"></span>
  </div>
  <nav>
    <div class="nav-wrap">
      <button class="hamburger" id="hamburger" onclick="toggleMenu()" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <a class="logo" onclick="renderPage('home')" style="cursor:pointer">Beads <em>n</em> Charms</a>

          <option value="default">Default</option>

        <div>
          <h2 id="shopResultTitle">${esc(catName_)}</h2>
          <div class="shop-count" id="shopCount">${prods.length} products</div>
        </div>
      </div>

    </div>
  </div>
  `+footerHTML();
}

function applyShopFilters(){
  let prods=Store.getProds();
  const cat=currentPageData;
  if(cat==='sale')prods=prods.filter(p=>p.onSale);
  else if(cat)prods=prods.filter(p=>p.cat===cat);
  if(document.getElementById('fInstock')?.checked)prods=prods.filter(p=>p.inStock);
  if(document.getElementById('fFeatured')?.checked)prods=prods.filter(p=>p.featured);
  const sort=document.getElementById('shopSort')?.value;
  if(sort==='price-asc')prods.sort((a,b)=>salePrice(a)-salePrice(b));
  else if(sort==='price-desc')prods.sort((a,b)=>salePrice(b)-salePrice(a));
  else if(sort==='name')prods.sort((a,b)=>a.name.localeCompare(b.name));
  else if(sort==='sale')prods.sort((a,b)=>b.onSale-a.onSale);
  const grid=document.getElementById('shopGrid');
  if(grid)grid.innerHTML=prods.map(productCardHTML).join('')||'<div class="empty-grid">No products found.</div>';
  const count=document.getElementById('shopCount');
  if(count)count.textContent=prods.length+' products';
}

function selectPayOpt(val){

  document.getElementById('payOpt-'+val)?.classList.add('sel');
  const note=document.getElementById('manualNote');
  if(note)note.className='manual-note'+(val!=='cod'?' show':'');

async function placeOrder(){
  const btn=document.getElementById('placeOrderBtn');
  if(btn&&btn.disabled)return;              // guard against double-submit
  const emailEl=document.getElementById('coEmail');
  const fn=document.getElementById('coFN')?.value.trim();
  const phone=document.getElementById('coPhone')?.value.trim();
  const addr=document.getElementById('coAddr')?.value.trim();
  const city=document.getElementById('coCity')?.value.trim();
  const email=emailEl?.value.trim()||'';
  if(!fn||!phone||!addr||!city){toast('Please fill all required fields');return;}
  // Email is the upsert key for customers & subscribers, so it must be valid.
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    emailEl?.classList.add('error');
    toast('Please enter a valid email address');
    emailEl?.focus();
    return;
  }
  emailEl?.classList.remove('error');

  const payment=document.querySelector('input[name=payment]:checked')?.value||'cod';
  const sub=Cart.total();const del=sub>=2000?0:300;
  const name=(fn+' '+(document.getElementById('coLN')?.value||'').trim()).trim();
  const province=document.getElementById('coProv')?.value||'';
  const notes=document.getElementById('coNotes')?.value||'';
  // Flatten to the shape sbSaveOrder / the orders + order_items tables expect.
  const items=Cart.get().map(i=>{
    const p=Store.getProd(i.id);
    return{productId:i.id,name:p?p.name:i.id,price:p?salePrice(p):0,qty:i.qty};
  });

  if(btn){btn.disabled=true;btn.textContent='Placing order…';}
  let orderId;
  try{
    orderId=await sbSaveOrder({name,email,phone,address:addr,city,province,notes,
      payment,subtotal:sub,delivery:del,total:sub+del,items});
  }finally{
    if(btn){btn.disabled=false;btn.textContent='Place Order ✦';}
  }

  // Local copy is a backup only — the database is the source of truth.
  Store.addOrder({id:orderId,customer:{name,phone,email,address:addr,city,province,notes},
    items,payment,subtotal:sub,delivery:del,total:sub+del});
  Cart.clear();
  document.getElementById('successOrderId').textContent=orderId;
  document.getElementById('successModal').classList.add('open');
}

function closeSuccessModal(){document.getElementById('successModal').classList.remove('open')}

function exportEmails(){
  const subs=window._adminSubs||[];
  if(!subs.length){toast('No subscribers to export');return;}
  // Quote every cell, and neutralise leading =,+,-,@ so Excel can't treat a
  // customer-supplied name as a formula.
  const cell=v=>{let s=String(v==null?'':v);if(/^[=+\-@]/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"';};
  const csv=['Email,Name,Source,Date',...subs.map(s=>[s.email,s.name||'',s.source||'checkout',s.created_at?new Date(s.created_at).toLocaleDateString():''].map(cell).join(','))].join('\r\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='beadsncharms_emails_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  toast('Email list exported ✓');
}

// Core fetch wrapper for Supabase REST API
async function sbFetch(path, opts={}){
  const url = SUPABASE_URL + '/rest/v1/' + path;
  const headers = {
    'apikey': SUPABASE_ANON,
    'Authorization': 'Bearer ' + SUPABASE_ANON,
    'Content-Type': 'application/json',
    'Prefer': opts.prefer || 'return=representation'
  };
  const res = await fetch(url, {
    method: opts.method || 'GET',
    headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if(!res.ok){
    const txt = await res.text();
    throw new Error('Supabase ' + res.status + ': ' + txt);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : [];
}

// Supabase Storage upload (still uses fetch directly)
async function sbStorageFetch(path, file){
  const url = SUPABASE_URL + '/storage/v1/object/product-images/' + path;
  const res = await fetch(url, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_ANON,
      'Authorization': 'Bearer ' + SUPABASE_ANON,
      'x-upsert': 'true'
    },
    body: file
  });
  if(!res.ok) throw new Error('Storage upload failed: ' + res.status);
  return SUPABASE_URL + '/storage/v1/object/public/product-images/' + path;
}

// DB status indicator
const DB_STATUS_BASE='position:fixed;bottom:20px;right:20px;z-index:9999;padding:10px 18px;border-radius:50px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,.15);transition:all .3s';
function dbStatus(msg, type='ok'){
  let el=document.getElementById('dbStatusBar');
  if(!el){
    el=document.createElement('div');
    el.id='dbStatusBar';
    document.body.appendChild(el);
  }
  const colors={ok:'background:#2D7D52;color:#fff',err:'background:#C0392B;color:#fff',info:'background:#3D2467;color:#fff',saving:'background:#6B4E9B;color:#fff'};
  // Rebuild rather than append: `+= a || b` parsed as `(cssText + a) || b`, so the
  // fallback never fired and the style string grew on every single call.
  el.style.cssText=DB_STATUS_BASE+';'+(colors[type]||colors.info);
  el.innerHTML=(type==='saving'?'<span style="display:inline-block;width:10px;height:10px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite"></span>':type==='ok'?'✓':type==='err'?'✕':'●')+' '+msg;
  el.style.opacity='1';el.style.transform='translateY(0)';
  if(type!=='saving')setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(8px)'},3000);
}

// ── Supabase data loaders ─────────────────────────────────
async function sbLoadCatalog(){
  dbStatus('Loading store…','saving');
  try{
    const [cats, prods] = await Promise.all([
      sbFetch('categories?order=sort_order'),
      sbFetch('products?order=created_at')
    ]);
    if(cats && cats.length){
      const mapped = cats.map(c=>({id:c.id,name:c.name,emoji:c.emoji||'📿',desc:c.description||''}));
      localStorage.setItem('bnc_categories', JSON.stringify(mapped));
    }
    if(prods && prods.length){
      const mapped = prods.map(p=>({
        id:p.id, name:p.name, cat:p.category_id,
        price:p.price, onSale:p.on_sale, salePct:p.sale_percent||0,
        desc:p.description||'', tags:p.tags||[],
        emoji:p.emoji||'📿', color:p.color||'linear-gradient(135deg,#F4EDFC,#E8D5F5)',
        inStock:p.in_stock, featured:p.featured,
        image:p.image_url||null
      }));
      localStorage.setItem('bnc_products', JSON.stringify(mapped));
    }
    dbStatus('Store loaded ✓','ok');
    return true;
  }catch(e){
    console.warn('Supabase load failed, using local data:',e.message);
    dbStatus('Using local data','info');
    return false;
  }
}

// ── Save order to Supabase ────────────────────────────────
async function sbSaveOrder(orderData){
  dbStatus('Saving order…','saving');
  try{
    const now = new Date().toISOString();
    // 1. Upsert customer
    await sbFetch('customers?on_conflict=email', {
      method:'POST', prefer:'resolution=merge-duplicates',
      body:{email:orderData.email,name:orderData.name,phone:orderData.phone,city:orderData.city,updated_at:now}
    });
    // 2. Upsert subscriber
    await sbFetch('email_subscribers?on_conflict=email', {
      method:'POST', prefer:'resolution=merge-duplicates',
      body:{email:orderData.email,name:orderData.name,source:'checkout'}
    });
    // 3. Insert order
    const orderId = 'ORD-'+Date.now();
    await sbFetch('orders', {
      method:'POST',
      body:{id:orderId,customer_email:orderData.email,customer_name:orderData.name,
        customer_phone:orderData.phone,address:orderData.address,city:orderData.city,
        province:orderData.province||'',notes:orderData.notes||'',payment:orderData.payment,
        subtotal:orderData.subtotal,delivery:orderData.delivery,total:orderData.total,
        status:'pending',created_at:now,updated_at:now}
    });
    // 4. Insert order items
    if(orderData.items.length){
      await sbFetch('order_items', {
        method:'POST',
        body:orderData.items.map(i=>({order_id:orderId,product_id:i.productId,
          product_name:i.name,price:i.price,quantity:i.qty,subtotal:i.price*i.qty}))
      });
    }
    dbStatus('Order saved ✓','ok');
    return orderId;
  }catch(e){
    console.error('Order save error:',e);
    dbStatus('Order save failed — saved locally','err');
    return 'ORD-'+Date.now();
  }
}

async function sbClearAllSales(){
  const now=new Date().toISOString();
  await sbFetch('products?id=not.is.null',{method:'PATCH',body:{on_sale:false,sale_percent:0,updated_at:now}})
    .catch(e=>console.warn('Clear sales failed:',e));
}

// ── Admin: upload image to Supabase Storage ───────────────
async function sbUploadImage(file, productId){
  dbStatus('Uploading image…','saving');
  try{
    const ext=file.name.split('.').pop();
    const path='products/'+(productId||('p'+Date.now()))+'.'+ext;
    const url=await sbStorageFetch(path,file);
    dbStatus('Image uploaded ✓','ok');
    return url;
  }catch(e){
    console.error('Image upload failed:',e);
    dbStatus('Upload failed','err');
    return null;
  }
}

// ═══════════════════════════════════════════════
//  TAGLINE ROTATOR
// ═══════════════════════════════════════════════
const TAGLINES=[
  "Your new charm obsession ✦",
  "Because basic isn't your vibe 💜",
  "Made to match your aesthetic ✨",
  "Beads n Charms: because basic is boring 📿"
];
let tagIdx=0,tagTimer=null,tagInterval=null;
function startTaglineRotator(){
  const left=document.getElementById('announceLeft');
  const tg=document.getElementById('announceTagline');
  // Called on every page render, so always tear down the previous cycle first —
  // otherwise the intervals stack and the bar flickers faster and faster.
  clearTimeout(tagTimer);clearInterval(tagInterval);
  if(!left||!tg)return;
  // After 3s show first tagline
  tagTimer=setTimeout(()=>{
    left.style.display='none';
    tg.style.display='inline';
    tg.style.opacity='0';
    tg.textContent=TAGLINES[tagIdx];
    setTimeout(()=>tg.style.opacity='1',50);
    tagInterval=setInterval(()=>{
      tg.style.opacity='0';
      setTimeout(()=>{
        tagIdx=(tagIdx+1)%TAGLINES.length;
        tg.textContent=TAGLINES[tagIdx];
        tg.style.opacity='1';
      },500);
    },3000);
  },3000);
}
